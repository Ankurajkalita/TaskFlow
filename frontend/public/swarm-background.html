<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particles Swarm Export</title>
    <style>body { margin: 0; overflow: hidden; background: #000; }</style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // CONFIG
        const COUNT = 20000;
        const SPEED_MULT = 1;
        const AUTO_SPIN = true;

        // SETUP
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.01);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 100);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = AUTO_SPIN;
        controls.autoRotateSpeed = 2.0;

        // POST PROCESSING
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.strength = 1.8; bloomPass.radius = 0.4; bloomPass.threshold = 0;
        composer.addPass(bloomPass);

        // SWARM OBJECTS
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();
        const target = new THREE.Vector3();
        const pColor = new THREE.Color(); // Kept for safety, for potential references
        
        // INSTANCED MESH
        const geometry = new THREE.TetrahedronGeometry(0.25);
        const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
        
        const instancedMesh = new THREE.InstancedMesh(geometry, material, COUNT);
        instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        scene.add(instancedMesh);

        // DATA ARRAYS
        const positions = [];
        for(let i=0; i<COUNT; i++) {
            positions.push(new THREE.Vector3((Math.random()-0.5)*100, (Math.random()-0.5)*100, (Math.random()-0.5)*100));
            instancedMesh.setColorAt(i, color.setHex(0x00ff88)); // Init Color
        }

        // CONTROL STUBS
        const PARAMS = {"size":62,"speed":0.55,"warp":0.72,"pulse":0.16,"twist":3.2};
        const addControl = (id, label, min, max, val) => {
            return PARAMS[id] !== undefined ? PARAMS[id] : val;
        };
        const setInfo = () => {};
        const annotate = () => {};

        // ANIMATION LOOP
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime() * SPEED_MULT;
            
            // Shader Time Update
            if(material.uniforms && material.uniforms.uTime) {
                material.uniforms.uTime.value = time;
            }

            controls.update();

            // SWARM LOGIC
            const count = COUNT; // Alias for user code compatibility
            for(let i=0; i<COUNT; i++) {
                 // USER CODE INJECTION START
                 const size = addControl("size", "Swarm Size", 20, 120, 62);
                 const speed = addControl("speed", "4D Rotation", 0, 2.5, 0.55);
                 const warp = addControl("warp", "Dimensional Warp", 0, 1.5, 0.72);
                 const pulse = addControl("pulse", "Breathing", 0, 0.45, 0.16);
                 const twist = addControl("twist", "Field Twist", 0, 8, 3.2);
                 
                 const invCount = 1 / Math.max(count, 1);
                 const u = i * invCount;
                 const g = i * 0.6180339887498949;
                 const f = g - Math.floor(g);
                 
                 const a = u * 6.283185307179586;
                 const b = f * 6.283185307179586 + Math.sin(a * 3 + time * 0.31) * 0.22;
                 
                 const ca = Math.cos(a);
                 const sa = Math.sin(a);
                 const cb = Math.cos(b);
                 const sb = Math.sin(b);
                 
                 const t0 = time * speed;
                 const c0 = Math.cos(t0);
                 const s0 = Math.sin(t0);
                 const c1 = Math.cos(t0 * 0.731);
                 const s1 = Math.sin(t0 * 0.731);
                 
                 const qx = ca * c0 - sb * s0;
                 const qw = ca * s0 + sb * c0;
                 const qy = sa * c1 - cb * s1;
                 const qz = sa * s1 + cb * c1;
                 
                 const phase = a * twist + b * 2.0 - time * (0.7 + speed * 0.4);
                 const wave = Math.sin(phase) * 0.5 + Math.sin(phase * 0.37 + b * 3.0) * 0.25;
                 const breath = 1 + pulse * Math.sin(time * 1.13 + a * 2.0 + b);
                 
                 const denom = 1 + warp * 0.62 * qw;
                 const proj = size * breath / Math.max(denom, 0.08);
                 
                 const bend = 1 + 0.13 * wave;
                 const x = qx * proj * bend;
                 const y = qy * proj * (1 - 0.09 * wave);
                 const z = qz * proj + wave * size * 0.18;
                 
                 target.set(x, y, z);
                 
                 const energy = 0.5 + 0.5 * Math.sin(phase + qw * 4.0);
                 const hue = u + 0.16 * Math.sin(b + time * 0.12) + 0.08 * qw;
                 const sat = 0.72 + energy * 0.25;
                 const light = 0.34 + energy * 0.28 + 0.06 * Math.abs(qw);
                 
                 color.setHSL(hue, sat, light);
                 
                 if (i === 0) {
                 setInfo(
                 "Clifford Rift",
                 "A rotating 4D Clifford torus projected into 3D, threaded with travelling interference waves."
                 );
                 annotate("rift-core", new THREE.Vector3(0, 0, 0), "4D Projection Core");
                 }
                 
                 // USER CODE INJECTION END

                 // LERP & UPDATE
                 positions[i].lerp(target, 0.1);
                 dummy.position.copy(positions[i]);
                 dummy.updateMatrix();
                 instancedMesh.setMatrixAt(i, dummy.matrix);
                 instancedMesh.setColorAt(i, color); // Fix: Use 'color' which user modifies
            }
            instancedMesh.instanceMatrix.needsUpdate = true;
            instancedMesh.instanceColor.needsUpdate = true;

            composer.render();
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
